# Local full-stack. Production deployments use Elastic Beanstalk + RDS, not this.
#
#   docker compose up --build
#
# Every image is built from a Dockerfile in its own directory, so the same
# build definition is used locally and in CI. If they diverge, the pipeline
# tests something nobody runs.

name: store

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Depends on a real query, not just a listening socket, so dependent
      # containers never start against a database that is not ready to accept
      # connections yet.
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    # Cache only: no persistence, so there is nothing to lose on restart.
    # Note the directive spelling: Redis 7.4 renamed `append-only` to
    # `appendonly` and now refuses to start on the old name.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://store:store@db:5432/store
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env - the app refuses a placeholder in production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # One-shot: creates the schema and inserts demo data, then exits.
  seed:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://store:store@db:5432/store
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    command: ["python", "-m", "app.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
    environment:
      # nginx resolves this at startup; there is no localhost fallback on purpose.
      BACKEND_HOST: api
      BACKEND_PORT: "8000"
    depends_on:
      - api
    ports:
      - "3000:8080"

  admin:
    build:
      context: ./admin
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: "8000"
    depends_on:
      - api
    ports:
      - "5173:8080"

volumes:
  db_data:
