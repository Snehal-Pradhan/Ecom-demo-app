name: Auto Linter

on:
  workflow_call:
    inputs:
      service:
        description: Which service to lint - frontend, admin, or backend.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      service:
        description: Which service to lint - frontend, admin, or backend.
        required: false
        type: string
        default: backend

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node
        if: contains(fromJSON('["frontend", "admin"]'), inputs.service)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.service }}/package-lock.json

      - name: Install dependencies
        if: contains(fromJSON('["frontend", "admin"]'), inputs.service)
        working-directory: ${{ inputs.service }}
        run: npm ci

      - name: Check the files for linting
        if: contains(fromJSON('["frontend", "admin"]'), inputs.service)
        working-directory: ${{ inputs.service }}
        run: npm run lint

      - name: Setup Python
        if: inputs.service == 'backend'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install the Linter
        if: inputs.service == 'backend'
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Check the files for linting
        if: inputs.service == 'backend'
        working-directory: backend
        run: ruff check .
