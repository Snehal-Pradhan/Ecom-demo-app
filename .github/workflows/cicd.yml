name: CICD

on:
  workflow_dispatch:

jobs:
  code:
    runs-on: ubuntu-slim
    steps:
      - name: Clone the Code
        run: echo "Cloning the Code"

  build:
    needs: [code]
    runs-on: ubuntu-slim
    steps:
      - name: Build using Docker
        run: echo "Building using Docker"

  test:
    needs: [build]
    runs-on: ubuntu-slim
    steps:
      - name: Running test cases
        run: echo "Testing the app"

  deploy:
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - name: Deploying on the machine
        run: echo "Deploying the code"
