name: CI

# Three stages, in cost order: code, then build, then test.
#
# The order is not arbitrary. Each stage costs more than the one before it, and
# each one can be made to fail by a smaller mistake:
#
#   code   ~20s   lint.      A trailing space fails here, not after a build.
#   build  ~90s   compile.   Three images, in parallel. A broken import fails here.
#   test   ~60s   behaviour. 35 tests against a real database.
#
# So the cheapest gate runs first and stops the rest. The cost of this ordering
# is that a test failure is only discovered after the images have built. That is
# a deliberate trade: fail-fast on trivial mistakes, and accept ~90s of wasted
# build time when something subtler is wrong. Removing `needs:` from the test job
# runs the stages in parallel instead, if you would rather pay the other way.

on:
  push:
    branches: ["**"]   # all branches, not tags
  pull_request:
  workflow_dispatch:

# Read-only by default. A workflow that does not need write access should say so.
# Nothing here reads a secret or publishes anything, which is what makes it safe
# to run on a pull request from a fork.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================== CODE ========
  # Two jobs, not one matrix over all three services. A matrix means "the same
  # job, run N times with a different value" - and these are not the same job.
  # The backend is Python: setup-python, pip, ruff. The web apps are Node:
  # setup-node, npm ci, eslint. Forcing them into one matrix means every step
  # needs an `if: matrix.service == 'backend'` branch, which hides the real
  # difference instead of expressing it. Two toolchains, two jobs.
  #
  # The web apps *are* a matrix, because those two genuinely are the same job.

  code-backend:
    name: Code (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tooling
        run: pip install ruff

      - name: Lint
        run: ruff check .

  code-web:
    name: Code (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Keyed on the lockfile, so a source-only change reuses the cache and
          # a dependency change invalidates it.
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        # npm ci, not npm install: installs exactly what the lockfile pins and
        # fails if it disagrees with package.json.
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.service }}

      # Warnings do not fail this job, and that is deliberate. The 7
      # react-hooks/set-state-in-effect findings are real - data fetching inside
      # useEffect causes a second render pass - but clearing them means moving
      # fetching out of effects entirely, which is a refactor and not a config
      # change. Adding --max-warnings 0 now would block every unrelated change
      # behind that refactor. Revisit when it is actually done.

  # ============================================================= 2. BUILD =====
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-backend, code-web]
    strategy:
      # One failure should not cancel the other two: a broken admin image does
      # not make the backend image less interesting to look at.
      fail-fast: false
      matrix:
        service: [backend, frontend, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # This is the build that matters. The frontends are Vite apps, and their
      # `npm run build` runs inside the builder stage of their own Dockerfile -
      # so building the image compiles the frontend. There is no separate
      # "npm run build" step because it would be the same work twice.
      #
      # push is false and always will be in this file: CI proves the images
      # build, it does not publish them.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: store/${{ matrix.service }}:ci-${{ github.sha }}
          # Cross-run cache, keyed by the build context. A source-only change
          # reuses every layer up to COPY; a dependency change invalidates from
          # there down, which is why the Dockerfiles copy lockfiles first.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================= TEST ========
  # Not a matrix, deliberately. A test matrix only means something if every
  # entry has tests to run, and right now:
  #
  #   backend    35 pytest tests
  #   frontend    0
  #   admin       0
  #
  # Two no-op jobs in a matrix is worse than no matrix - it makes the pipeline
  # look like it covers three services when it covers one. Give the web apps a
  # runner and real tests first, then this becomes a matrix with substance.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    # Pytest runs against real PostgreSQL rather than SQLite. SQLite accepts
    # things Postgres rejects and vice versa, so testing on SQLite hides exactly
    # the bugs worth catching. That means this job owns a database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: store_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store -d store_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://store:store@localhost:5432/store_test
      # A throwaway value. Tests assert on behaviour, not on a real secret, and
      # this job deliberately has none.
      SECRET_KEY: ci-test-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest
