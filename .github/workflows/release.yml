name: Release

# The only workflow that holds credentials and the only one that publishes.
# It never runs on pull_request, so untrusted code can never reach this path.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN      a read/write token, NOT the account password

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release. Abandoning a push halfway leaves some images tagged
# and some not, which is worse than taking the extra few minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: store

jobs:
  # Runs once, before any build. A wrong registry or a read-only token
  # otherwise fails at the very end of a full three-image build, after all the
  # time and compute, with a message that does not name the actual problem.
  preflight:
    name: Verify registry access
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.check.outputs.registry }}
    env:
      # The probe pushes a two-byte image to a repository that already exists,
      # so this creates no new repository. It exists to answer one question -
      # "can this token actually write?" - which neither `docker login` nor the
      # identity check can answer. Delete the tag from the Docker Hub UI at any
      # time; nothing depends on it.
      PROBE_REPO: github-actions-practice-master

    steps:
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check identity and write access
        id: check
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PROBE: ${{ env.PROBE_REPO }}
        run: |
          set -euo pipefail

          # 1. Who does this token belong to? Best effort, not a hard gate.
          #
          #    This is an advisory lookup against hub.docker.com, not the
          #    registry, and it is the least reliable part of this script: any
          #    non-200 or unexpected response shape used to abort the release
          #    with a raw curl error that said nothing useful. So a failure
          #    here falls back to the configured username and continues - the
          #    write probe below is the gate that actually matters.
          code=$(curl -sS -o /tmp/who.json -w '%{http_code}' \
                   https://hub.docker.com/v2/user/ \
                   -H "Authorization: JWT ${TOKEN}" || true)
          # Docker Hub has accepted both schemes for personal access tokens
          # depending on the endpoint. Try the other one before giving up.
          if [ "${code}" != "200" ]; then
            code=$(curl -sS -o /tmp/who.json -w '%{http_code}' \
                     https://hub.docker.com/v2/user/ \
                     -H "Authorization: Bearer ${TOKEN}" || true)
          fi
          who=""
          if [ "${code}" = "200" ]; then
            who=$(python3 -c "import json;print(json.load(open('/tmp/who.json'))['username'])" 2>/dev/null || true)
          fi

          if [ -z "${who}" ]; then
            echo "::warning::Identity lookup returned HTTP ${code}; falling back to DOCKERHUB_USERNAME. Response: $(head -c 300 /tmp/who.json)"
            who="${USERNAME}"
          fi

          echo "token authenticates as : ${who}"
          echo "DOCKERHUB_USERNAME     : ${USERNAME}"
          if [ "${who}" != "${USERNAME}" ]; then
            echo "::warning::These differ. If the push is denied, this mismatch is why."
          fi

          # 2. The real gate: can this token actually write?
          #    `docker login` succeeds on a read-only token, so a clean login
          #    proves nothing. A FROM scratch image is the cheapest possible
          #    real push: no base to pull, nothing to compile.
          printf 'FROM scratch\n' > /tmp/Dockerfile.probe
          echo "probing write access with a ${who}/${PROBE}:write-probe push"
          docker build -t "${who}/${PROBE}:write-probe" -f /tmp/Dockerfile.probe /tmp
          if ! docker push "${who}/${PROBE}:write-probe"; then
            echo "::error::Token for '${who}' authenticated but cannot push to '${PROBE}', a repository that already exists."
            echo "::error::If the scope reads 'Read & Write', the DOCKERHUB_TOKEN secret is probably holding a different token than the one you think - check for an older value or a trailing newline."
            exit 1
          fi
          echo "write access confirmed"

          echo "registry=${who}" >> "$GITHUB_OUTPUT"

      # Docker Hub does not reliably auto-create a repository on push, and the
      # failure when it doesn't is opaque: "repository does not exist or may
      # require authorization", which reads like a permissions problem rather
      # than a missing repository. Ensuring the target exists first turns that
      # into a non-event.
      - name: Ensure repositories exist
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          for repo in "store/api" "store/frontend" "store/admin"; do
            encoded=$(printf '%s' "${repo}" | sed 's|/|%2F|')
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
              "https://hub.docker.com/v2/repositories/${USERNAME}/" \
              -H "Authorization: JWT ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"name\": \"${repo}\"}")
            case "${code}" in
              201) echo "created  ${USERNAME}/${repo}" ;;
              409) echo "exists   ${USERNAME}/${repo}" ;;
              *)   echo "::error::Could not ensure ${USERNAME}/${repo} (HTTP ${code}): $(cat /tmp/body)"
                   exit 1 ;;
            esac
          done

  build-and-push:
    name: Build + push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, admin]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The registry comes from the preflight output, which came from asking
      # Docker Hub who the token belongs to. One source of truth: there is no
      # hardcoded username that can drift away from the secret.
      #
      # sha-<commit> is the tag that matters: immutable, and traceable to exactly
      # the source that produced it. A `latest` tag is mutable by definition, so
      # two hosts pulling it minutes apart can run different code with no way to
      # tell. Everything else here is a convenience label on top.
      #
      # backend maps to the api service, so the matrix name and the image name
      # do not match - hence the explicit service->name mapping.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ needs.preflight.outputs.registry }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service == 'backend' && 'api' || matrix.service }}:sha-${{ github.sha }}
            ${{ needs.preflight.outputs.registry }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service == 'backend' && 'api' || matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Proves the artifact that was just published actually serves traffic, by
  # pulling those exact images - not rebuilding them - and running the real
  # compose topology against them.
  smoke:
    name: Smoke test the published images
    runs-on: ubuntu-latest
    needs: [preflight, build-and-push]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the images this run pushed
        env:
          REGISTRY: ${{ needs.preflight.outputs.registry }}
        run: |
          set -euo pipefail
          for pair in "api" "frontend" "admin"; do
            docker pull "${REGISTRY}/${{ env.IMAGE_PREFIX }}/${pair}:sha-${{ github.sha }}"
            # Re-tag to the name compose expects, so the stack runs the artifact
            # that was just published rather than a fresh local build.
            docker tag "${REGISTRY}/${{ env.IMAGE_PREFIX }}/${pair}:sha-${{ github.sha }}" \
                       "store/${pair}:ci"
          done

      - name: Start the stack from the pulled images
        env:
          IMAGE_TAG: ci
          SECRET_KEY: release-smoke-secret-at-least-32-characters
        run: docker compose up -d --no-build

      - name: Wait and smoke test
        env:
          IMAGE_TAG: ci
          SECRET_KEY: release-smoke-secret-at-least-32-characters
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "storefront up after ~$((i*5))s"
              break
            fi
            sleep 5
          done
          docker compose ps
          # Through the storefront, not the API's own port. The API deliberately
          # publishes no port to the host, so :8000 is unreachable from a runner -
          # and that is the correct topology, not a bug. Going through nginx
          # exercises the real path a browser takes, including the reverse proxy.
          ./scripts/smoke.sh http://localhost:3000

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
