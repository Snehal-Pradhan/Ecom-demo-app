name: Release

# The only workflow that holds credentials and the only one that publishes.
# It never runs on pull_request, so untrusted code can never reach this path.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN      a Personal Access Token with "Repo Read & Write"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release. Abandoning a push halfway leaves some images tagged
# and some not, which is worse than taking the extra few minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can fail in seconds, checked before a single image is built.
  preflight:
    name: Verify registry
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      # An existing repository, so the probe creates nothing. Delete the tag
      # from the Docker Hub UI whenever; nothing depends on it.
      PROBE_REPO: github-actions-practice-master

    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # This deliberately uses buildx and --push, exactly like the real build
      # below. A probe that used `docker build && docker push` would prove the
      # credentials work and nothing else - it would not exercise buildx, the
      # cache backend, or attestation handling, which is where the previous two
      # failures actually lived. The target is a repository that already exists,
      # so this creates nothing.
      - name: Confirm the token can push through buildx
        run: |
          set -euo pipefail
          # buildx reads a file literally named Dockerfile from the context, so
          # the context gets its own directory rather than a -f flag.
          mkdir -p /tmp/probe
          printf 'FROM scratch\n' > /tmp/probe/Dockerfile
          if ! docker buildx build \
                --push \
                --provenance=true \
                --tag "${{ env.DOCKERHUB_USER }}/${{ env.PROBE_REPO }}:write-probe" \
                /tmp/probe; then
            echo "::error::buildx could not push. This is the same path the release build uses."
            echo "::error::If the tag above resolved to an empty registry, the secret is missing."
            exit 1
          fi
          echo "registry=${{ env.DOCKERHUB_USER }}"

      # Docker Hub does not auto-create repositories on push for this account,
      # and reports the failure as "insufficient_scope" rather than as a missing
      # repository, which reads like a permissions fault. Creating a repository
      # is a one-time human action, so this verifies rather than creates.
      # Two different things are checked here, and they are not the same check.
      #
      # A repository can EXIST and still be unpushable. Docker Hub reports a
      # freshly created empty repository as present via its web API, but the
      # registry will not grant write scope for it, and the push then fails at
      # auth.docker.io with "access token has insufficient scopes" - which reads
      # like a token problem and is not. status 1 is active; 0 is inactive, and
      # an inactive repository has to be pushed to once by hand before CI can
      # write to it.
      - name: Confirm target repositories exist and are active
        run: |
          set -euo pipefail
          missing=()
          inactive=()
          for repo in api frontend admin; do
            body=$(curl -sS "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_USER }}/${repo}/")
            status=$(printf '%s' "${body}" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status'))" 2>/dev/null || echo "null")
            case "${status}" in
              1)  echo "active    ${{ env.DOCKERHUB_USER }}/${repo}" ;;
              0)  echo "inactive  ${{ env.DOCKERHUB_USER }}/${repo}"
                   inactive+=("${repo}") ;;
              *)  echo "absent    ${{ env.DOCKERHUB_USER }}/${repo}"
                   missing+=("${repo}") ;;
            esac
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Create these first, one per image, at https://hub.docker.com/r/${{ env.DOCKERHUB_USER }}/"
            echo "::error::${missing[*]}"
            exit 1
          fi
          if [ ${#inactive[@]} -gt 0 ]; then
            echo "::error::These exist but have never had an image pushed, so the registry will not grant write scope for them:"
            echo "::error::${inactive[*]}"
            echo "::error::Activate each one once, by hand:"
            echo "::error::  docker login   # your Docker Hub password, not the token"
            echo "::error::  docker pull hello-world"
            echo "::error::  for r in ${inactive[*]}; do docker tag hello-world ${{ env.DOCKERHUB_USER }}/\$r:latest && docker push ${{ env.DOCKERHUB_USER }}/\$r:latest; done"
            exit 1
          fi

  build-and-push:
    name: Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      # A broken admin image does not make the backend image less interesting.
      fail-fast: false
      matrix:
        # include, not two parallel lists. Two lists in one matrix produce the
        # CARTESIAN PRODUCT - [a,b,c] x [x,y,z] is nine combinations, not three -
        # so this would build nine images and push them all at the same two tags
        # concurrently. include gives exactly the three pairs intended.
        include:
          - context: backend
            image: api
          - context: frontend
            image: frontend
          - context: admin
            image: admin

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Provenance attestations push an extra OCI artifact alongside the
          # image. Docker Hub's support for OCI referrers is incomplete, and
          # when it is not there the push fails at the very last step - after
          # a successful build, with a credentials error that is not about
          # credentials. The preflight probe does not use buildx, so it does not
          # exercise this path and cannot catch it.
          #
          # Provenance is worth having in a supply-chain-conscious pipeline, and
          # it is cheap to turn back on if you move to a registry that supports
          # it properly.
          provenance: false
          sbom: false
          # sha-<commit> is the tag that matters: immutable, and traceable to
          # exactly the source that produced it. `latest` is mutable by
          # definition, so two hosts pulling it minutes apart can run different
          # code with no way to tell. It is a convenience label, never the thing
          # you deploy by.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Proves the artifacts that were just published actually serve traffic, by
  # pulling those exact images rather than rebuilding them. A rebuild would
  # validate something nobody is going to run.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [preflight, build-and-push]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull what was just pushed
        run: |
          set -euo pipefail
          for image in api frontend admin; do
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/${image}:sha-${{ github.sha }}"
            # Re-tag to the name compose expects, so the stack runs the published
            # artifact instead of a fresh local build.
            docker tag "${{ secrets.DOCKERHUB_USERNAME }}/${image}:sha-${{ github.sha }}" "store/${image}:ci"
          done

      - name: Start the stack
        env:
          IMAGE_TAG: ci
          SECRET_KEY: release-smoke-secret-at-least-32-characters
        run: docker compose up -d --no-build

      - name: Smoke test
        env:
          IMAGE_TAG: ci
          SECRET_KEY: release-smoke-secret-at-least-32-characters
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
              echo "storefront up after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          docker compose ps
          # Through the storefront, not the API's own port. The API publishes
          # no port to the host by design, so :8000 is unreachable from a runner
          # and that is correct. Going through nginx exercises the real browser
          # path, reverse proxy included.
          ./scripts/smoke.sh http://localhost:3000

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
